<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenOutlier popup demo</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../popup/popup.css">
  <style>body { margin: 24px auto; box-shadow: 0 18px 48px -12px rgba(11, 14, 26, 0.35); }</style>
</head>
<body>
  <!-- Loads the real popup/popup.html markup and popup.js with a stubbed chrome.* API.
       Add ?empty to see the first-run state. -->
  <script>
    (async function () {
      var empty = /[?&]empty\b/.test(location.search);
      var M = null;
      function posts(n, base, spread) {
        var o = {};
        for (var i = 0; i < n; i++) {
          var views = Math.round(base * (i % 9 === 0 ? spread : 0.5 + (i % 5) / 4));
          o['c' + i] = { code: 'c' + i, platform: 'instagram', type: 'reel', views: views, likes: Math.round(views / 20), comments: 40, takenAt: Date.now() - i * 864e5 };
        }
        return o;
      }
      // YouTube: Shorts and long-form, each with its own median.
      function ytPosts(n) {
        var o = posts(n, 40000, 7);
        Object.keys(o).forEach(function (k, i) { o[k].platform = 'youtube'; o[k].type = i % 3 ? 'video' : 'short'; if (o[k].type === 'short') o[k].views *= 6; });
        return o;
      }
      var store = empty ? {} : {
        'rs:p:excel.ipuclari': { posts: posts(60, 200000, 9), updatedAt: Date.now() - 2 * 36e5 },
        'rs:p:tt/excel.ipuclari': { posts: posts(48, 230000, 6), updatedAt: Date.now() - 3 * 36e5 },
        'rs:p:exceldersleri': { posts: posts(20, 60000, 1.2), updatedAt: Date.now() - 864e5 },
        'rs:p:yt/exceldemo': { posts: ytPosts(30), updatedAt: Date.now() - 5 * 36e5, platform: 'youtube' },
        'rs:mentions': { items: { a: {}, b: {}, c: {}, d: {} }, read: { d: true } },
        'rs:watches': [{}],
        'rs:bridge': { connected: true, port: 47321, lastSyncAt: Date.now() - 6e4, lastBackupAt: Date.now() - 36e5, lastBackupOk: true, settingsAt: Date.now() }
      };
      // ?bridge=off|nokey|ready: the bridge's copy of the key (default nokey).
      var demoBridge = new URLSearchParams(location.search).get('bridge') || 'nokey';
      if (!empty && demoBridge === 'off') store['rs:bridge'] = { connected: false };
      if (!empty && demoBridge === 'ready') Object.assign(store['rs:bridge'], { bridgeApiKey: true, bridgeApiKeySource: 'file', bridgeQuota: { day: new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date()), units: 12 } });
      var storageListeners = [];
      // ?ytapi: a saved YouTube Data API key with some quota used today.
      if (/[?&]ytapi\b/.test(location.search)) {
        store['rs:settings'] = { youtubeApiKey: 'AIza' + 'D'.repeat(31) + 'demo' };
        store['rs:yt-api-quota'] = { day: new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date()), units: 37 };
      }
      window.chrome = {
        storage: {
          local: {
            get: async function (k) {
              var all = JSON.parse(JSON.stringify(store));
              if (k == null) return all;
              var o = {};
              [].concat(k).forEach(function (x) { if (x in all) o[x] = all[x]; });
              return o;
            },
            set: async function (o) {
              var c = {};
              Object.keys(o).forEach(function (k) { c[k] = { oldValue: store[k], newValue: o[k] }; store[k] = o[k]; });
              setTimeout(function () { storageListeners.forEach(function (fn) { fn(c, 'local'); }); }, 0);
            },
            remove: async function (k) { [].concat(k).forEach(function (x) { delete store[x]; }); }
          },
          onChanged: { addListener: function (fn) { storageListeners.push(fn); } }
        },
        runtime: {
          getURL: function (p) { return '/' + p; },
          getManifest: function () { return { version: '0.2.0' }; },
          sendMessage: async function (m) {
            if (m && m.type === 'reelscope:bridge-key') {
              await new Promise(function (r) { setTimeout(r, 300); });
              if (!(store['rs:bridge'] || {}).connected) return { ok: false, error: 'The bridge isn\'t running.' };
              await chrome.storage.local.set({ 'rs:bridge': Object.assign({}, store['rs:bridge'], { bridgeApiKey: m.action !== 'remove', bridgeApiKeySource: m.action !== 'remove' ? 'file' : null }) });
              return { ok: true };
            }
            return null;
          }
        },
        tabs: { query: async function () { return [{ id: 1 }]; }, create: function () {}, sendMessage: async function () { throw new Error('demo'); } },
        permissions: { request: async function () { return true; }, remove: async function () { return true; } }
      };
      var html = await (await fetch('/popup/popup.html')).text();
      var doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML.replace(/\.\.\/brand\//g, '/brand/'));
      for (var src of ['/src/metrics.js', '/src/youtube.js', '/src/youtube-api.js', '/popup/popup.js']) {
        await new Promise(function (res) { var s = document.createElement('script'); s.src = src; s.onload = res; document.body.appendChild(s); });
      }
    })();
  </script>
</body>
</html>
