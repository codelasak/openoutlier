<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenOutlier Library demo</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
</head>
<body>
  <!-- Loads the real dashboard/dashboard.html markup and scripts with a stubbed
       chrome.* API, three fake Instagram accounts built from dev/graphql/query.json,
       two fake subreddits from dev/reddit/listings.json, and a fake "Excel Bug"
       creator on TikTok (dev/tiktok/item_list.json) + the same videos on Instagram
       (dev/tiktok/ig-twin.json) for the Compare view, and a YouTube channel (dev/youtube). -->
  <script src="../src/extract.js"></script>
  <script src="../src/tiktok.js"></script>
  <script src="../src/youtube.js"></script>
  <script src="../src/reddit.js"></script>
  <script src="../src/mentions.js"></script>
  <script>
    (async function () {
      var store = {};
      var listeners = [];
      function fire(changes) { listeners.forEach(function (fn) { fn(changes, 'local'); }); }
      window.chrome = {
        storage: {
          local: {
            get: async function (k) {
              var all = JSON.parse(JSON.stringify(store));
              if (typeof k === 'string') { var o = {}; if (k in all) o[k] = all[k]; return o; }
              return all;
            },
            set: async function (o) { var c = {}; Object.keys(o).forEach(function (k) { c[k] = { oldValue: store[k], newValue: o[k] }; store[k] = JSON.parse(JSON.stringify(o[k])); }); fire(c); },
            remove: async function (k) { var c = {}; [].concat(k).forEach(function (x) { c[x] = { oldValue: store[x] }; delete store[x]; }); fire(c); }
          },
          onChanged: { addListener: function (fn) { listeners.push(fn); } }
        },
        runtime: {
          id: 'demo',
          getURL: function (p) { return '/' + p; },
          sendMessage: async function (m) {
            console.log('[demo] message', m.type, m.what, (m.posts || []).length); window.__demoLast = m;
            if (m.type === 'reelscope:mentions-check') {
              // Pretend the background found one new comment.
              var cur = store['rs:mentions'];
              var add = ReelScopeMentions.mergeMentions(cur.items, [ReelScopeMentions.shape({ id: 't1_demo' + Date.now().toString(36), kind: 'comment', watchId: 'w1', query: '"excel formula"', title: 'Weird formula behaviour', excerpt: 'Your excel formula is volatile because of INDIRECT…', subreddit: 'excel', author: 'helper42', permalink: 'https://www.reddit.com/r/excel/', createdAt: Date.now(), score: 1, foundAt: Date.now() }, 'extension')]);
              await chrome.storage.local.set({ 'rs:mentions': { items: add.items, read: cur.read }, 'rs:mentions-state': Object.assign({}, store['rs:mentions-state'], { lastRunAt: Date.now(), lastNew: 1 }) });
              return { new: 1 };
            }
            if (m.type === 'reelscope:mentions-server-sync') {
              await chrome.storage.local.set({ 'rs:mentions-state': Object.assign({}, store['rs:mentions-state'], { server: { lastFailAt: Date.now(), lastError: new Date().toISOString() + ' Failed to fetch (demo: no server)' } }) });
              return { ok: true, added: 0 };
            }
            // Phase 5 stand-ins: ?ytapi (a saved Data API key), ?ytanalytics=setup|connect|connected (My YouTube channel).
            var qs = new URLSearchParams(location.search);
            if (m.type === 'reelscope:yt-api-status') return { configured: qs.has('ytapi'), quota: { used: window.__ytUnits || 37, limit: 10000 }, running: false };
            if (m.type === 'reelscope:yt-api') {
              await new Promise(function (r) { setTimeout(r, 600); });
              var rec = store['rs:p:' + m.owner];
              var n = 0;
              Object.keys(rec.posts).forEach(function (c) { var p = rec.posts[c]; if (p.viewsApprox || p.dateApprox !== false) { n++; p.views = Math.round((p.views || 0) * 1.03); p.viewsApprox = false; p.takenAt = p.takenAt || Date.now() - n * 5 * 864e5; p.dateApprox = false; delete p.dateDay; } });
              window.__ytUnits = (window.__ytUnits || 37) + Math.ceil(Object.keys(rec.posts).length / 50);
              await chrome.storage.local.set({ ['rs:p:' + m.owner]: rec });
              return { ok: true, updated: n, units: Math.ceil(Object.keys(rec.posts).length / 50), quota: { used: window.__ytUnits, limit: 10000 } };
            }
            if (m.type === 'reelscope:yt-analytics') return demoAnalytics(m, qs.get('ytanalytics'));
            return { ok: true, queued: (m.posts || []).length, skipped: 0, failed: 0 };
          }
        },
        permissions: { request: async function () { return true; }, contains: async function () { return true; } }
      };

      function demoAnalytics(m, mode) {
        var connected = mode === 'connected' || window.__ytConnected;
        if (m.path === '/youtube/analytics/status') return mode ? { ok: true, configured: mode !== 'setup', connected: !!connected, channel: connected ? { title: 'Excel Bugs (demo)', handle: 'ExcelBugsDemo', subscribers: 18400 } : null } : { ok: false, noBridge: true, error: 'My YouTube channel runs through the OpenOutlier bridge on your Mac (it keeps the Google sign-in), and the bridge isn\'t running.' };
        if (m.path === '/youtube/analytics/connect') { setTimeout(function () { window.__ytConnected = true; }, 2000); return { ok: true, url: 'about:blank' }; }
        if (m.path === '/youtube/analytics/disconnect') { window.__ytConnected = false; return { ok: true }; }
        if (m.path === '/youtube/analytics/channel') return { ok: true, channel: { title: 'Excel Bugs (demo)', handle: 'ExcelBugsDemo', subscribers: 18400 }, totals: { views: 412000, engaged_views: 351000, watch_minutes: 610000, avg_view_duration_s: 41, avg_view_pct: 71.4, subscribers_gained: 930, subscribers_lost: 85, likes: 21000, comments: 940, shares: 3100 } };
        if (m.path === '/youtube/analytics/videos') return { ok: true, videos: [0, 1, 2, 3, 4, 5].map(function (i) {
          return { id: 'yTdemo0003' + i, title: ['Excel Bug #12: the date that turns into a number', 'Why VLOOKUP returns #N/A', 'Excel Bug #11: merged cells', 'XLOOKUP in 40 seconds', 'Excel Bug #10: phantom spaces', 'Flash Fill trick'][i], format: i % 2 ? 'video' : 'short',
            views: [180000, 92000, 61000, 40000, 22000, 9000][i], engaged_views: [151000, 88000, 50000, 37000, 17000, 8200][i], avg_view_pct: [84.1, 46.3, 77.9, 52.2, 69.0, 58.4][i], avg_view_duration_s: [32, 215, 29, 120, 25, 61][i],
            impressions: [210000, 610000, 95000, 380000, 60000, 140000][i], ctr_pct: [8.4, 6.1, 7.2, 4.2, 5.0, 3.3][i],
            likes: [9100, 3800, 2900, 1500, 900, 300][i], comments: [410, 260, 120, 80, 40, 12][i], subscribers_gained: [380, 210, 90, 60, 30, 8][i] };
        }) };
        if (m.path === '/youtube/analytics/retention') {
          var pts = [];
          for (var i = 1; i <= 100; i++) pts.push({ at: i / 100, watch_ratio: Math.round((i < 4 ? 1.02 - i * 0.04 : 0.88 * Math.exp(-i / 140) + (i > 60 && i < 66 ? 0.08 : 0)) * 1000) / 1000 });
          return { ok: true, id: m.id, points: pts, summary: { start: 1, at_25pct: 0.74, at_50pct: 0.62, at_75pct: 0.52, end: 0.43, steepest_drop: { at: 0.04, loss: 0.15 }, rewatched_at: [0.01] } };
        }
        return { ok: false, error: 'demo: ' + m.path };
      }

      // Fake accounts.
      var text = await (await fetch('/dev/graphql/query.json')).text();
      var base = ReelScopeExtract.parseText(text);
      [['demo.kitchen', 1, 'Demo Kitchen'], ['spreadsheet.tips', 3.2, 'Spreadsheet Tips'], ['tiny.cafe', 0.2, 'Tiny Cafe']].forEach(function (a, ai) {
        var posts = {};
        base.forEach(function (p, i) {
          if (ai === 2 && i > 20) return;
          var q = JSON.parse(JSON.stringify(p));
          q.owner = a[0]; q.ownerName = a[2]; q.code = p.code + ai;
          q.views = Math.round(p.views * a[1] * (0.6 + ((i * 37) % 10) / 10));
          q.likes = Math.round(p.likes * a[1]);
          if (i % 9 === 0) q.shares = Math.round(q.likes / 4);
          posts[q.code] = q;
        });
        store['rs:p:' + a[0]] = { posts: posts, updatedAt: Date.now() - ai * 86400000 * 2 };
      });
      var listings = await (await fetch('/dev/reddit/listings.json')).json();
      Object.keys(listings).forEach(function (sub) {
        var posts = {};
        ReelScopeReddit.parseListing(listings[sub]).posts.forEach(function (p) { posts[p.code] = p; });
        store['rs:p:r/' + sub] = { posts: posts, updatedAt: Date.now() - 3600000, platform: 'reddit', kind: 'subreddit' };
      });
      // TikTok + the same series on Instagram.
      var ttPages = await (await fetch('/dev/tiktok/item_list.json')).json();
      var ttPosts = {};
      ReelScopeTikTok.parseText(JSON.stringify(ttPages)).forEach(function (p) {
        var id = p.owner;
        var rec = store['rs:p:' + id] || (store['rs:p:' + id] = { posts: {}, updatedAt: Date.now() - 1800e3, platform: 'tiktok' });
        rec.posts[p.code] = p;
      });
      store['rs:p:tt/excel.bugs.demo'].profile = { username: 'excel.bugs.demo', nickname: 'Excel Bugs (demo)', followers: 48213, videos: 40 };
      var twin = await (await fetch('/dev/tiktok/ig-twin.json')).json();
      store['rs:p:excel.bugs.demo'] = { posts: {}, updatedAt: Date.now() - 7200e3 };
      twin.forEach(function (p) { store['rs:p:excel.bugs.demo'].posts[p.code] = p; });
      // A YouTube channel (dev/youtube): Videos + Shorts tabs, plus one opened video and one opened Short (exact stats).
      var YT = self.OpenOutlierYouTube;
      var ytPosts = {};
      var ytChannel = null;
      for (var f of [['channel-videos.html'], ['channel-shorts.html'], ['watch.html', 'yTdemo00029'], ['short.html', 'yTdemo00035']]) {
        var res = YT.parsePage(await (await fetch('/dev/youtube/' + f[0])).text(), { lang: 'en', videoId: f[1] || null });
        if (!ytChannel && res.channel) ytChannel = res.channel;
        res.posts.forEach(function (p) { ytPosts[p.code] = YT.merge(ytPosts[p.code], p); });
      }
      store['rs:p:yt/exceldemo'] = { posts: ytPosts, updatedAt: Date.now() - 900e3, platform: 'youtube', profile: ytChannel };
      // The "Excel Bug" series also as YouTube Shorts (titles, some exact dates, some none), for Compare.
      var ytBugs = {};
      twin.forEach(function (p, i) {
        if (i % 4 === 3) return;
        var code = ('yTbug' + p.code).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11).padEnd(11, '0');
        var q = { code: code, platform: 'youtube', type: 'short', url: 'https://www.youtube.com/shorts/' + code, owner: 'yt/excel.bugs.demo', author: 'excel.bugs.demo', ownerName: 'Excel Bugs (demo)',
          caption: String(p.caption || '').split('\n')[0].slice(0, 90), hashtags: (p.hashtags || []).slice(0, 2), views: Math.round((p.views || 1000) * (0.4 + (i % 5) * 0.3)), viewsApprox: i % 3 === 0, likes: Math.round((p.likes || 10) * 0.5), duration: p.duration, files: [], thumb: p.thumb };
        if (i % 3 !== 2 && p.takenAt) { q.takenAt = p.takenAt + 5 * 3600e3; q.dateApprox = false; }
        ytBugs[code] = q;
      });
      store['rs:p:yt/excel.bugs.demo'] = { posts: ytBugs, updatedAt: Date.now() - 600e3, platform: 'youtube', profile: { handle: 'excel.bugs.demo', name: 'Excel Bugs (demo)', subscribers: 18400 } };
      store['rs:org'] = { folders: [{ id: 'f1', name: 'Food creators' }, { id: 'f2', name: 'Excel' }], accounts: { 'demo.kitchen': { folder: 'f1', tags: ['competitor', 'recipes'] }, 'spreadsheet.tips': { folder: 'f2', tags: ['competitor'] }, 'r/excel': { folder: 'f2', tags: ['research'] }, 'r/spreadsheets': { folder: 'f2', tags: ['research'] }, 'excel.bugs.demo': { folder: 'f2', tags: ['mine'] }, 'tt/excel.bugs.demo': { folder: 'f2', tags: ['mine'] }, 'yt/exceldemo': { folder: 'f2', tags: ['competitor'] } } };

      // Fake Reddit keyword watches and mentions.
      var now = Date.now();
      store['rs:watches'] = [
        { id: 'w1', query: '"excel formula"', subreddits: ['excel', 'spreadsheets'], exclude: ['hiring'], kinds: ['posts', 'comments'], enabled: true },
        { id: 'w2', query: 'handsonexcel', subreddits: [], exclude: [], kinds: ['posts', 'comments'], enabled: true },
        { id: 'w3', query: 'xlookup #n/a', subreddits: ['excel'], exclude: [], kinds: ['posts'], enabled: false }
      ];
      var demoM = [
        ['t3_m1', 'post', 'w1', 'Excel formula to split names into first and last?', 'I have a column with full names and need an excel formula that splits them…', 'excel', 'newbie_99', 3600e3, 14, 'extension'],
        ['t1_m2', 'comment', 'w1', 'Best way to learn formulas', '…honestly the best excel formula course I found was free on YouTube, look for…', 'spreadsheets', 'sheetfan', 5 * 3600e3, 3, 'hayati'],
        ['t3_m3', 'post', 'w2', 'Has anyone used handsonexcel.com?', 'Saw their Excel Bug reels, are the practice files any good?', 'learnexcel', 'curious_cat', 26 * 3600e3, 22, 'extension'],
        ['t3_m4', 'post', 'w1', 'Excel formula returns 0 instead of blank', 'Dragging the formula down shows 0 for empty rows…', 'excel', 'zero_hero', 50 * 3600e3, 41, 'hayati']
      ].map(function (a) { return ReelScopeMentions.shape({ id: a[0], kind: a[1], watchId: a[2], query: a[2] === 'w1' ? '"excel formula"' : 'handsonexcel', title: a[3], excerpt: a[4], subreddit: a[5], author: a[6], permalink: 'https://www.reddit.com/r/' + a[5] + '/', createdAt: now - a[7], score: a[8], foundAt: now - a[7] + 600e3 }, a[9]); });
      store['rs:mentions'] = { items: ReelScopeMentions.mergeMentions({}, demoM).items, read: { t3_m4: 1 } };
      store['rs:mentions-state'] = { lastRunAt: now - 6 * 60e3, lastNew: 1, via: 'tab', warnings: ['"handsonexcel": comments need a subreddit list (Reddit has no comment search), so only posts are checked.'] };

      // "My account": open with ?studio=<address of a chatmany worker or a local stand-in> to link it.
      var studio = new URLSearchParams(location.search).get('studio');
      if (studio) store['rs:studio'] = { baseUrl: studio, token: 'demo' };

      var html = await (await fetch('/dashboard/dashboard.html')).text();
      var doc = new DOMParser().parseFromString(html, 'text/html');
      doc.body.querySelectorAll('script').forEach(function (s) { s.remove(); });
      document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML.replace(/\.\.\/icons\//g, '/icons/'));
      // dashboard.js fetches '../src/panel.css' relative to /dashboard/.
      var realFetch = window.fetch;
      window.fetch = function (u) { if (u === '../src/panel.css') return realFetch('/src/panel.css'); return realFetch.apply(this, arguments); };
      for (var src of ['/src/metrics.js', '/src/compare.js', '/src/panel.js', '/dashboard/mentions-view.js', '/src/studio.js', '/dashboard/studio-view.js', '/dashboard/youtube-channel-view.js', '/dashboard/dashboard.js']) {
        await new Promise(function (res) { var s = document.createElement('script'); s.src = src; s.onload = res; document.body.appendChild(s); });
      }
    })();
  </script>
</body>
</html>
