  <script>
    (async function () {
      var store = {};
      var listeners = [];

            },
            set: async function (o) { var c = {}; Object.keys(o).forEach(function (k) { c[k] = { oldValue: store[k], newValue: o[k] }; store[k] = JSON.parse(JSON.stringify(o[k])); }); fire(c); },

        runtime: {
          id: 'demo',

          sendMessage: async function (m) {

            if (m.type === 'reelscope:mentions-check') {

              var add = ReelScopeMentions.mergeMentions(cur.items, [ReelScopeMentions.shape({ id: 't1_demo' + Date.now().toString(36), kind: 'comment', watchId: 'w1', query: '"excel formula"', title: 'Weird formula behaviour', excerpt: 'Your excel formula is volatile because of INDIRECT…', subreddit: 'excel', author: 'helper42', permalink: 'https://www.reddit.com/r/excel/', createdAt: Date.now(), score: 1, foundAt: Date.now() }, 'extension')]);

            }
            // Phase 5 stand-ins: ?ytapi (a saved Data API key), ?ytanalytics=setup|connect|connected (My YouTube channel).

              Object.keys(rec.posts).forEach(function (c) { var p = rec.posts[c]; if (p.viewsApprox || p.dateApprox !== false) { n++; p.views = Math.round((p.views || 0) * 1.03); p.viewsApprox = false; p.takenAt = p.takenAt || Date.now() - n * 5 * 864e5; p.dateApprox = false; delete p.dateDay; } });

      // Niş Takibi (#/niche): ?niche=off (no bridge) | empty (nothing tracked: the start helper) | new (tracking just started) | default (ten simulated weeks, dev/make-niche-fixture.mjs).
      var nichePage = null;
      var nicheSponsors = null;
      async function demoNiche(m, mode) {
        await new Promise(function (r) { setTimeout(r, 350); });
        if (mode === 'off') return { ok: false, noBridge: true, error: 'Niche tracking runs in the OpenOutlier bridge on your Mac (it keeps measuring while Chrome is closed), and the bridge isn\'t running.' };
        if (!nichePage) nichePage = await (await fetch('/dev/youtube/niche/page.json')).json();
        var p = JSON.parse(JSON.stringify(nichePage));
        // Phase 4: who the niche promotes (dev/make-content-fixture.mjs runs src/sponsors.js over made-up descriptions); ?sponsors=empty.
        if (!nicheSponsors) nicheSponsors = await (await fetch('/dev/youtube/content/niche-sponsors.json')).json();
        if (!(store['rs:settings'] && store['rs:settings'].features && store['rs:settings'].features['channel-sponsors'] === false)) {

          if (Array.isArray(o)) { o.forEach(walk); return; }
          if (!o || typeof o !== 'object') return;

            var v = o[k];

      // Phase 5 (discovery): ?radar=off (configured, switched off: the cost preview) | empty (on, no keywords) | new (configured,
      // not run yet) | default (this morning's run). Answers from dev/make-discovery-fixture.mjs (the real bridge code).
      // ?providers=keys (Social Blade + DataForSEO keys set) | on (and switched on); ?niche=off also stops these (no bridge).
      var discFx = {};
      async function discFixture(name) {
        if (!discFx[name]) discFx[name] = await (await fetch('/dev/youtube/discovery/' + name + '.json')).json();
        var f = JSON.parse(JSON.stringify(discFx[name]));
        var shift = f.now ? Date.now() - f.now : 0;
        (function walk(o) {
          if (Array.isArray(o)) { o.forEach(walk); return; }
          if (!o || typeof o !== 'object') return;
          Object.keys(o).forEach(function (k) {
            var v = o[k];
            if (typeof v === 'number' && v > 1.6e12 && v < 2.2e12 && /(at|^now|published_at)$/.test(k)) o[k] = v + shift;
            else if (v && typeof v === 'object') walk(v);
          });
        })(f);
        return f;
      }
      window.__provKeys = window.__provKeys || {};
      function provStatus() {
        var feats = (store['rs:settings'] && store['rs:settings'].features) || {};
        var meta = {
          ryd: ['Return YouTube Dislike', [], false, { en: 'Free (100 requests a minute per client)', tr: 'Bedava (istemci başına dakikada 100 istek)' }],
          socialblade: ['Social Blade Business API', ['clientId', 'token'], false, { en: 'Prepaid credits: 1 per channel for 30 days of history, 2 for a year, 3 for 3 years (100 credits ≈ $50)', tr: 'Önceden ödenen kredi: kanal başına 30 günlük geçmiş 1, bir yıl 2, 3 yıl 3 kredi (100 kredi ≈ $50)' }],
          dataforseo: ['DataForSEO (YouTube SERP)', ['login', 'password'], true, { en: 'Pay as you go: about $0.002 per keyword check (live mode); $50 minimum top-up that doesn\'t expire', tr: 'Kullandıkça öde: kelime kontrolü başına yaklaşık $0,002 (canlı mod); en az $50 yüklenir, süresi dolmaz' }]
        };
        var out = {};
        Object.keys(meta).forEach(function (id) {
          var x = meta[id];
          out[id] = { name: x[0], on: feats['provider-' + id] === true, needs_key: x[1].length > 0, configured: x[1].length ? !!window.__provKeys[id] : true, scraping: x[2], fields: x[1], cost: x[3] };
        });

      async function syncProviders() {
        var p = provStatus();

      }
      async function demoDiscovery(m, qs) {

        if (qs.get('niche') === 'off' || (store['rs:bridge'] && !store['rs:bridge'].connected)) return { ok: false, noBridge: true, error: 'Discovery runs in the OpenOutlier bridge on your Mac, and it isn\'t running.' };

        var feats = s.features || {};

          r.cost.total = r.cost.search + r.cost.videos + r.cost.channels;
          r.suggestions = r.suggestions.filter(function (x) { return r.keywords.indexOf(x.keyword) === -1; });
          if (mode === 'off' || mode === 'new' || mode === 'empty' || window.__radarRuns === 0) { r.breakouts = []; r.rising = []; r.results = 0; r.runs = []; r.next_run_at = r.feature ? Date.now() + 40e3 : null; }

          var k = await discFixture(m.lang === 'tr' ? 'keywords-tr' : 'keywords');

          k.radar_keywords = rk;
          k.ideas.forEach(function (i) { i.on_radar = rk.indexOf(i.keyword) !== -1; });

          if (feats['keyword-ideas'] === false) { k.feature = false; k.autocomplete = false; k.ideas = k.ideas.filter(function (i) { return i.sources.indexOf('autocomplete') === -1 || i.sources.length > 1; }); k.fetched = 0; k.cached = 0; }
          return k;
        }
        if (m.what === 'thumbs') { var t = await discFixture('thumbs'); return t; }
        if (m.what === 'similar') return discFixture(m.channel && /sheetwizard/i.test(m.channel) ? 'similar-sheetwizard' : 'similar-kenji');
        if (m.what === 'providers') return { ok: true, providers: provStatus() };
        if (m.what === 'provider-key') { if (m.remove) delete window.__provKeys[m.id]; else window.__provKeys[m.id] = true; await syncProviders(); return { ok: true, providers: provStatus() }; }
        if (m.what === 'sb-quote') { var per = { '30d': 1, '1y': 2, '3y': 3 }[m.history] || 2; var chs = Array.from({ length: 15 }, function (_, i) { return 'UCsimdemo' + i; }); return { ok: true, provider: 'Social Blade Business API', history: m.history || '1y', per_channel: per, channels: chs, free: chs.slice(0, 2), credits: 13 * per, est_usd: 13 * per * 0.5 }; }
        if (m.what === 'sb-backfill') { await new Promise(function (r) { setTimeout(r, 700); }); return { ok: true, history: m.history, credits_used: m.confirm, credits_left: 100 - m.confirm, channels: Array.from({ length: 15 }, function (_, i) { return { channel_id: 'UCsimdemo' + i, days: m.history === '3y' ? 1095 : m.history === '30d' ? 30 : 365 }; }) }; }
        if (m.what === 'dfs-check') return { ok: true, checked: ((s.radar && s.radar.rankKeywords) || []).map(function (k, i) { return { keyword: k, rank: i % 2 ? null : 7 + i }; }), cost: 0.004 };
        return { ok: false, error: 'bad request' };
      }

      // My YouTube channel / Kanalım (#/my-youtube): ?ytanalytics=setup | connect | connected (one channel on its way to the YPP) |
      // two (Hands on Excel + a Quran channel, with the combined view) | tiny (a brand-new channel) | monetized | reconnect
      // (an old sign-in without the revenue scope + an expired one) | collecting (history still loading) | oldbridge.
      // Pages come from dev/make-own-fixture.mjs (the real bridge code over a simulated Google). No ?ytanalytics = no bridge.
      var ownFixtures = {};
      async function ownFixture(mode) {
        var name = { connected: 'connected', two: 'two', tiny: 'tiny', monetized: 'monetized', reconnect: 'reconnect', collecting: 'collecting', oldbridge: 'connected' }[mode];
        if (!name) return null;
        if (!ownFixtures[name]) ownFixtures[name] = await (await fetch('/dev/youtube/own/' + name + '.json')).json();
        var f = JSON.parse(JSON.stringify(ownFixtures[name]));
        // The fixture was computed at f.now: move its times to now so "updated 2 h ago" reads right.
        var shift = Date.now() - f.now;
        (function walk(o) {
          if (Array.isArray(o)) { o.forEach(walk); return; }
          if (!o || typeof o !== 'object') return;
          Object.keys(o).forEach(function (k) {
            var v = o[k];
            if (typeof v === 'number' && v > 1.6e12 && v < 2.2e12 && /(_at|^at|^now|^ts|published_at)$/.test(k)) o[k] = v + shift;
            else if (v && typeof v === 'object') walk(v);

        })(f);
        return f;
      }
      async function demoOwn(m, mode) {
        await new Promise(function (r) { setTimeout(r, 300); });

        if (!f) return { ok: true, channels: [], page: null };

        return f.pages[key];
      }
      // X writing helper with your own key (src/x-llm-bg.js): the Settings card's messages. No key is kept here.
      var xllm = { enabled: false, hint: null, model: 'claude-opus-5-5', effortScore: 'low', effortWrite: 'medium', dailyCapUsd: 1, spent: 0.0123, calls: 3 };
      async function demoXLlm(m) {

          dailyCapUsd: xllm.dailyCapUsd, spentTodayUsd: xllm.spent, callsToday: xllm.calls,
          models: [{ id: 'claude-opus-5-5', label: 'Claude Opus 5.5', input: 4, output: 20 }, { id: 'claude-sonnet-5-5', label: 'Claude Sonnet 5.5', input: 2, output: 10 }, { id: 'claude-haiku-5-5', label: 'Claude Haiku 5.5', input: 0.1, output: 0.5 }] };
      }
      async function demoAnalytics(m, mode) {
        var connected = mode && mode !== 'setup' && mode !== 'connect' || window.__ytConnected;
        if (m.path === '/youtube/analytics/status') {
          if (!mode) return { ok: false, noBridge: true, error: 'My YouTube channel runs through the OpenOutlier bridge on your Mac (it keeps the Google sign-in), and the bridge isn\'t running.' };
          var fx = connected && await ownFixture(mode === 'connect' || mode === 'setup' ? 'connected' : mode);
          return fx ? fx.status : { ok: true, configured: mode !== 'setup', connected: false, channels: [] };
        }
        if (m.path === '/youtube/analytics/connect') { setTimeout(function () { window.__ytConnected = true; }, 2000); return { ok: true, url: 'about:blank' }; }
        if (m.path === '/youtube/analytics/disconnect') { window.__ytConnected = false; return { ok: true }; }
        if (m.path === '/youtube/analytics/channel') return { ok: true, channel: { title: 'Excel Bugs (demo)', handle: 'ExcelBugsDemo', subscribers: 18400 }, totals: { views: 412000, engaged_views: 351000, watch_minutes: 610000, avg_view_duration_s: 41, avg_view_pct: 71.4, subscribers_gained: 930, subscribers_lost: 85, likes: 21000, comments: 940, shares: 3100 } };
        if (m.path === '/youtube/analytics/videos') return { ok: true, videos: [0, 1, 2, 3, 4, 5].map(function (i) {
          return { id: 'yTdemo0003' + i, title: ['Excel Bug #12: the date that turns into a number', 'Why VLOOKUP returns #N/A', 'Excel Bug #11: merged cells', 'XLOOKUP in 40 seconds', 'Excel Bug #10: phantom spaces', 'Flash Fill trick'][i], format: i % 2 ? 'video' : 'short',
            views: [180000, 92000, 61000, 40000, 22000, 9000][i], engaged_views: [151000, 88000, 50000, 37000, 17000, 8200][i], avg_view_pct: [84.1, 46.3, 77.9, 52.2, 69.0, 58.4][i], avg_view_duration_s: [32, 215, 29, 120, 25, 61][i],
            impressions: [210000, 610000, 95000, 380000, 60000, 140000][i], ctr_pct: [8.4, 6.1, 7.2, 4.2, 5.0, 3.3][i],
            likes: [9100, 3800, 2900, 1500, 900, 300][i], comments: [410, 260, 120, 80, 40, 12][i], subscribers_gained: [380, 210, 90, 60, 30, 8][i] };
        }) };
        if (m.path === '/youtube/analytics/retention') {
          var pts = [];
          for (var i = 1; i <= 100; i++) pts.push({ at: i / 100, watch_ratio: Math.round((i < 4 ? 1.02 - i * 0.04 : 0.88 * Math.exp(-i / 140) + (i > 60 && i < 66 ? 0.08 : 0)) * 1000) / 1000 });
          return { ok: true, id: m.id, points: pts, summary: { start: 1, at_25pct: 0.74, at_50pct: 0.62, at_75pct: 0.52, end: 0.43, steepest_drop: { at: 0.04, loss: 0.15 }, rewatched_at: [0.01] } };
        }

      }

      // Demo only: blob downloads (exports, frames) are recorded instead of landing in ~/Downloads.
      document.addEventListener('click', function (e) {

      var text = await (await fetch('/dev/graphql/query.json')).text();
