<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReelScope demo</title>
  <style>
    body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; }
    header { padding: 24px 32px; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #666; }
    nav { display: flex; gap: 8px; padding: 12px 32px; }
    nav button { font: inherit; padding: 6px 10px; }
    main { padding: 12px 32px 40px; }
    [hidden] { display: none !important; }
    video { display: block; width: 340px; height: 600px; background: #222; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(4, 140px); gap: 4px; }
    .grid div { aspect-ratio: 9 / 16; background: #eee; }
  </style>
  <!-- Stand-in for the chrome.* APIs so the content scripts run on a normal page. -->
  <script>
    (function () {
      var data = {};
      var listeners = [];
      window.chrome = {
        storage: {
          local: {
            get: async function () { return JSON.parse(JSON.stringify(data)); },
            set: async function (o) { Object.assign(data, o); },
            remove: async function (k) { [].concat(k).forEach(function (x) { delete data[x]; }); }
          },
          onChanged: { addListener: function () {} }
        },
        runtime: {
          getURL: function (p) { return '/' + p; },
          onMessage: { addListener: function (fn) { listeners.push(fn); } },
          sendMessage: async function (m) {
            // Mirror what background.js would save, so the demo shows real file names.
            var names = [];
            (m.posts || []).forEach(function (p) {
              var base = ReelScopeMetrics.fileBaseName(p);
              if (m.what === 'cover') { if (p.cover) names.push('ReelScope/' + p.owner + '/' + base + '_cover.jpg'); }
              else (p.files || []).forEach(function (f, i, all) { names.push('ReelScope/' + p.owner + '/' + base + (all.length > 1 ? '_' + (i + 1) : '') + (f.kind === 'video' ? '.mp4' : '.jpg')); });
            });
            console.log('[demo] would download:\n' + names.join('\n'));
            window.__demoDownloads = names;
            return { ok: true, queued: names.length, skipped: 0, failed: 0 };
          }
        }
      };
      window.__demoOpenPanel = function () { listeners.forEach(function (fn) { fn({ type: 'reelscope:toggle' }, {}, function () {}); }); };

      // Fake /api/v1/media/{pk}/info/ from dev/media-info.json.
      var realFetch = window.fetch;
      var infoP = null;
      window.__demoDetailRequests = 0;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : input.url;
        var m = url.match(/\/api\/v1\/media\/(\d+)\/info\//);
        if (!m) return realFetch.apply(this, arguments);
        window.__demoDetailRequests++;
        infoP = infoP || realFetch('/dev/media-info.json').then(function (r) { return r.json(); });
        return infoP.then(function (all) {
          var body = all[m[1]];
          return new Response(JSON.stringify(body || { items: [] }), { status: body ? 200 : 404, headers: { 'content-type': 'application/json' } });
        });
      };
    })();
  </script>
  <script src="../src/hook.js"></script>
</head>
<body>
  <header>
    <h1>ReelScope demo page</h1>
    <p>Stands in for instagram.com. It loads a fake, partly incomplete Instagram response through the same hook the extension uses, then fills in the gaps.</p>
  </header>
  <nav>
    <button type="button" id="go-profile">Profile view</button>
    <button type="button" id="go-reel">Reel view (overlay)</button>
  </nav>
  <main>
    <video id="video" muted playsinline hidden></video>
    <div class="grid" id="grid"></div>
  </main>
  <script>for (var i = 0; i < 16; i++) document.getElementById('grid').appendChild(document.createElement('div'));</script>
  <script src="../src/extract.js"></script>
  <script src="../src/metrics.js"></script>
  <script src="../src/panel.js"></script>
  <script src="../src/overlay.js"></script>
  <script src="../src/content.js"></script>
  <script>
    var firstCode = null;
    document.getElementById('go-reel').onclick = function () {
      document.getElementById('grid').hidden = true;
      document.getElementById('video').hidden = false;
      history.pushState(null, '', '/reel/' + firstCode + '/');
    };
    document.getElementById('go-profile').onclick = function () {
      document.getElementById('grid').hidden = false;
      document.getElementById('video').hidden = true;
      history.pushState(null, '', '/dev/demo.html');
    };
    // Give content.js a moment to load storage + CSS, then "scroll" by loading data.
    setTimeout(function () {
      fetch('/dev/graphql/slim.json').then(function (r) { return r.clone().json(); }).then(function (j) {
        firstCode = j.data.xdt_api__v1__clips__user__connection_v2.edges[0].node.media.code;
        if (location.hash === '#reel') document.getElementById('go-reel').click();
        else setTimeout(window.__demoOpenPanel, 400);
      });
    }, 500);
  </script>
</body>
</html>
